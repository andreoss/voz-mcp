[package]
name = "voz-mcp"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Local offline text-to-speech with a CLI and an MCP stdio server"
readme = "README.md"
keywords = ["tts", "speech", "mcp", "offline", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]
rust-version = "1.85"

[[bin]]
name = "voz"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ureq = "3.4.1"

[dev-dependencies]
serde_json = "1"
